<body>

<div class="chat-container">
    <div class="header">
        <div class="profile-pic"></div>
        <div class="contact-info">
            <div class="contact-name">Milena Medeiros</div>
            <div class="contact-status">online</div>
        </div>
    </div>

    <div class="chat-window" id="chat-window"></div>
        <div class="typing-bubble" id="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>
    
    <div class="input-area" id="input-area">
        <input type="text" class="input-box" id="message-input" placeholder="Aguarde..." disabled onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="send-btn" disabled onclick="sendMessage()">➤</button>
    </div>
</div>

<div id="paper-template">
    <div id="paper-content"></div>
</div>

<div class="modal" id="image-modal">
    <div class="close-modal" onclick="closeModal()">×</div>
    <img id="modal-img" src="" alt="Carta" style="max-height: 80vh; max-width: 90vw; border-radius: 8px;">
    <div style="display: flex; gap: 15px; margin-top: 15px;">
        <button onclick="downloadImg()" style="background-color: #00a884; border: none; padding: 12px 20px; color: white; border-radius: 8px; font-weight: bold; cursor: pointer;">⬇ Baixar Imagem</button>
        <button onclick="printImg()" style="background-color: #005A9C; border: none; padding: 12px 20px; color: white; border-radius: 8px; font-weight: bold; cursor: pointer;">🖨 Imprimir Carta</button>
    </div>
</div>
<script>




    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const inputArea = document.getElementById('input-area');

    let step = 0;
    let isBotTyping = false;
    let letterContent = "";
    
    
    const urlParams = new URLSearchParams(window.location.search);
    const urlSession = urlParams.get('session') || '';
    let deliverableSessionId = urlSession || localStorage.getItem('templo_entregavel_session_id');
    if (!deliverableSessionId) {
        deliverableSessionId = 'entregavel_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        localStorage.setItem('templo_entregavel_session_id', deliverableSessionId);
    }
    
    let userData = {
        nome: '', afastamento: '', ente: '', parentesco: '', mensagem: '',
        perguntas: [], respostas: [], oraculo_amor: '', oraculo_financas: '', oraculo_familia: '', email: '', sessionId: deliverableSessionId,
        deliverTime: 0, packageAmount: 35
    };

    function packageFromAmount(amount) {
        amount = Number(amount || 35);
        if (amount >= 59.99) return { amount: 60, questions: 20, days: 90, amarracao: true, mao: true, title: 'Pacote Sagrado VIP - Tudo Incluso' };
        if (amount >= 54.99) return { amount: 55, questions: 10, days: 60, amarracao: true, mao: true, rival: true, title: 'Leitura Completa com Terceira Pessoa' };
        if (amount >= 44.99) return { amount: 45, questions: 7, days: 30, amarracao: true, mao: true, title: 'Amarração Amorosa com Leitura da Mão' };
        if (amount >= 34.99) return { amount: 35, questions: 5, days: 30, amarracao: true, title: 'Amarração Amorosa com 5 Respostas' };
        if (amount >= 24.99) return { amount: 25, questions: 5, days: 30, amarracao: false, title: 'Leitura Amorosa com Oráculo' };
        return { amount: 15, questions: 3, days: 0, amarracao: false, title: 'Leitura Amorosa Essencial' };
    }

    function applyPackage(amount) {
        const info = packageFromAmount(amount);
        userData.packageAmount = info.amount;
        userData.packageTitle = info.title;
        userData.questionLimit = info.questions;
        userData.oraculoDays = info.days;
        userData.hasAmarracao = info.amarracao;
        userData.hasVideochamada = !!info.videochamada;
        userData.sessions = info.sessions || 1;
        return info;
    }

    async function hydratePackageFromPurchase() {
        let amount = 20;
        try {
            const saved = JSON.parse(localStorage.getItem('templo_luz_pacote_pago') || '{}');
            if (saved.amount) amount = saved.amount;
        } catch(e) {}
        const pedido = urlParams.get('pedido') || '';
        if (pedido) {
            try {
                const res = await fetch('../check-purchase.php?external_id=' + encodeURIComponent(pedido));
                const data = await res.json();
                if (data && data.package && data.package.amount) amount = data.package.amount;
                else if (data && data.amount) amount = data.amount;
            } catch(e) {}
        }
        return applyPackage(amount);
    }

    const LEGACY_CACHE_KEY = 'temploLuz_chat2_cache';
    const CACHE_KEY = `temploLuz_chat2_cache_${deliverableSessionId}`;
    const CACHE_BACKUP_KEY = `${CACHE_KEY}_backup`;

    
    async function checkPurchased(hash) {
        if (!userData.email) return false;
        try {
            let res = await fetch('check_purchases.php?email=' + encodeURIComponent(userData.email) + '&session_id=' + userData.sessionId);
            let data = await res.json();
            return data.purchases.some(p => p.includes(hash));
        } catch(e) { return false; }
    }

    
    async function awaitPurchaseOrTimeout(hash, onSuccess, onSkip, linkUrl) {
        await typeMessage("Opa, recebi a confirmação do seu pedido! Vamos seguir em frente. 🙏");
        onSuccess();
    }
    function saveCache() {
        try {
            const state = {
                step: step, userData: userData, letterContent: letterContent,
                html: chatWindow.innerHTML, time: Date.now()
            };
            const serialized = JSON.stringify(state);
            localStorage.setItem(CACHE_BACKUP_KEY, serialized);
            localStorage.setItem(CACHE_KEY, serialized);
        } catch(e) {
            try {
                const safeState = {
                    step: step, userData: userData, letterContent: letterContent,
                    html: chatWindow.innerHTML.replace(/<img[^>]*src=["']data:image[^"']*["'][^>]*>/gi, '<div class="message received">Sua leitura foi gerada. Se ela não aparecer aqui, toque em imprimir/baixar quando a conversa continuar. <span class="time">' + getTime() + '</span></div>'),
                    time: Date.now()
                };
                localStorage.setItem(CACHE_KEY, JSON.stringify(safeState));
            } catch(err) {}
        }
    }

    function loadCache() {
        let cached = localStorage.getItem(CACHE_KEY) || localStorage.getItem(CACHE_BACKUP_KEY);
        if (!cached) {
            const legacy = localStorage.getItem(LEGACY_CACHE_KEY);
            if (legacy) {
                try {
                    const legacyState = JSON.parse(legacy);
                    if ((legacyState.userData || {}).sessionId === deliverableSessionId) {
                        cached = legacy;
                    }
                } catch(e) {}
            }
        }
        if (!cached) return false;
        
        try {
            const state = JSON.parse(cached);
            if ((Date.now() - state.time) / (1000 * 60 * 60) > 87600) {
                localStorage.removeItem(CACHE_KEY);
                localStorage.removeItem(CACHE_BACKUP_KEY);
                return false;
            }
            if ((state.userData || {}).sessionId && state.userData.sessionId !== deliverableSessionId) {
                return false;
            }
            
            step = state.step;
            userData = Object.assign(userData, state.userData || {}, { sessionId: deliverableSessionId });
            letterContent = state.letterContent || "";
            chatWindow.innerHTML = state.html || "";
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            const btns = chatWindow.querySelectorAll('.chat-btn');
            btns.forEach(btn => btn.style.display = 'none');
            
            if (step === 1) enableInput("Sua resposta...");
            else if (step === 15) enableInput("Sua resposta...");
            else if (step === 2) enableInput("Seu nome...");
            else if (step === 3) enableInput("Situação de vocês...");
            else if (step === 4) enableInput("Nome da pessoa amada...");
            else if (step === 5) enableInput("Relação atual...");
            else if (step === 6) enableInput("Sua pergunta...");
            else if (step === 7) { inputArea.style.display = 'none'; startLetterTimer(); }
            else if (step === 8) enableInput("Sua mensagem para " + userData.ente + "...");
            else if (step === 9) enableInput("Sua resposta...");
            else if (step === 10) enableInput("Sua resposta...");
            else if (step === 11) enableInput("Sua resposta...");
            else if (step === 100) { inputArea.style.display = 'none'; resumeExpress(); }
            else if (step === 110) { inputArea.style.display = 'none'; resumeExpress2(); }
            else if (step === 101) { inputArea.style.display = 'none'; resumeUpsell1(); }
            else if (step === 111) { inputArea.style.display = 'none'; resumeUpsell1_2(); }
            else if (step === 102) { inputArea.style.display = 'none'; resumeUpsell2(); }
            else if (step === 112) { inputArea.style.display = 'none'; resumeUpsell2_2(); }
            else if (step === 104) { inputArea.style.display = 'none'; resumeNovaCarta(); }
            else if (step === 114) { inputArea.style.display = 'none'; resumeNovaCarta2(); }
            else if (step === 103) { inputArea.style.display = 'none'; resumeFinalDonation(); }
            else { inputArea.style.display = 'none'; }
            
            return true;
        } catch (e) { return false; }
    }

    function getTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    }

    function addMessage(text, type) {
        let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\*(.*?)\*/g, '<i>$1</i>');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `${formatted} <span class="time">${getTime()}</span>`;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        saveCache();
    }
    
    function addImageMessage(dataUrl) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message received`;
        
        const img = document.createElement('img');
        img.src = dataUrl;
        img.style.width = '100%';
        img.style.borderRadius = '8px';
        img.style.cursor = 'pointer';
        img.onclick = () => openModal(dataUrl);
        
        msgDiv.appendChild(img);
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.innerText = getTime();
        msgDiv.appendChild(timeSpan);
        
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        saveCache();
    }

    // Modal
    function openModal(src) { document.getElementById('modal-img').src = src; document.getElementById('image-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('image-modal').style.display = 'none'; }
    function downloadImg() {
        const a = document.createElement('a'); a.href = document.getElementById('modal-img').src;
        a.download = 'minha_leitura_amorosa.jpg'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    function printImg() {
        const win = window.open(''); win.document.write('<img src="' + document.getElementById('modal-img').src + '" style="width:100%;">');
        win.print(); win.close();
    }

    function showTyping() { typingIndicator.style.display = 'flex'; chatWindow.scrollTop = chatWindow.scrollHeight; }
    function hideTyping() { typingIndicator.style.display = 'none'; }
    function disableInput() { messageInput.disabled = true; sendBtn.disabled = true; messageInput.placeholder = "Aguarde..."; }
    function enableInput(placeholder = "Mensagem...") {
        inputArea.style.display = 'flex'; // Garante que a barra reapareça!
        messageInput.disabled = false; sendBtn.disabled = false; messageInput.placeholder = placeholder;
        setTimeout(() => messageInput.focus(), 100); 
    }

    async function typeMessage(content, overrideDelay = null) {
        showTyping();
        let textLen = content.replace(/<[^>]*>?/gm, '').length;
        let calcDelay = textLen * 45;
        if (calcDelay < 1500) calcDelay = 1500;
        if (calcDelay > 5000) calcDelay = 5000;
        let finalDelay = overrideDelay !== null ? overrideDelay : calcDelay;

        return new Promise(resolve => {
            setTimeout(() => {
                hideTyping(); addMessage(content, 'received'); resolve();
            }, finalDelay);
        });
    }

    function showButtons(options) {
        return new Promise(resolve => {
            const btnGroup = document.createElement('div');
            btnGroup.className = 'btn-group';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `chat-btn ${opt.type || ''}`;
                btn.innerText = opt.label;
                btn.onclick = () => {
                    btnGroup.remove(); addMessage(opt.label, 'sent'); resolve(opt.value);
                };
                btnGroup.appendChild(btn);
            });
            chatWindow.appendChild(btnGroup); chatWindow.scrollTop = chatWindow.scrollHeight; saveCache();
        });
    }

    async function fetchLetter() {
        try {
            const res = await fetch('api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(userData) });
            const data = await res.json();
            return data.carta || "Infelizmente houve um erro espiritual. Tente novamente.";

            }
