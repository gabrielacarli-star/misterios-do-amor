      justify-content: center;
    }
    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #fbf9f5;
      border-left: 1px solid #fee2e2;
      border-right: 1px solid #fee2e2;
      box-shadow: 0 28px 80px rgba(24, 8, 41, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 22px;
      text-align: center;
    }
    .card {
      border: 1px solid #fee2e2;
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 18px 45px rgba(45, 20, 77, 0.12);
    }
    .seal {
      width: 82px;
      height: 82px;
      border-radius: 999px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-size: 38px;
      box-shadow: 0 14px 35px rgba(5, 150, 105, 0.28);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #f6d365;
      background: #fff8df;
      color: #92400e;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 16px 0 10px;
      font-family: "Plus Jakarta Sans", Inter, sans-serif;
      font-size: 28px;
      line-height: 1.12;
      letter-spacing: 0;
      color: #2b0f0f;
    }
    p {
      margin: 0;
      color: #8a4a4a;
      font-size: 15px;
      line-height: 1.65;
      font-weight: 500;
    }
    .count {
      margin: 18px auto 0;
      width: 100%;
      overflow: hidden;
      border-radius: 999px;
      background: #f1e8fb;
      border: 1px solid #e1d3ee;
      height: 12px;
    }
    .bar {
      width: 100%;
      height: 100%;
      transform-origin: left center;
      animation: drain 5s linear forwards;
      background: linear-gradient(90deg, #f59e0b, #d97706, #10b981);
    }
    .button {
      display: inline-flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      margin-top: 22px;
      min-height: 54px;
      border-radius: 18px;
      background: linear-gradient(90deg, #f59e0b, #d97706, #b45309);
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 28px rgba(217, 119, 6, 0.24);
    }
    .foot {
      margin-top: 22px;
      font-size: 11px;
      color: #8a4a4a;
    }
    @keyframes drain {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
  </style>
  <script>
    function contatoUrl() {
      return "contato/" + (window.location.search || "");
    }
    window.setTimeout(function () {
      window.location.href = contatoUrl();
    }, 5000);
  </script>
